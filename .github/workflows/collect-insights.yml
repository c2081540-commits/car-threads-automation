name: Collect Threads insights

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/collect-insights.yml
      - app/insights.py
      - app/threads_api.py
      - scripts/analyze_insights.py

permissions:
  contents: write

concurrency:
  group: car-threads-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect live post insights
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python -m app.cli collect-insights
      - name: Build analysis report
        run: python scripts/analyze_insights.py
      - name: Save insight snapshot
        run: |
          git config user.name "car-threads-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/insights/latest.json data/insights/latest.csv reports/insights_latest.md
          if ! git diff --cached --quiet; then
            git commit -m "data: collect Threads insights"
            git pull --rebase origin main
            git push
          fi
